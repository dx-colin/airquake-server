// ── Server Identity ───────────────────────────────────────────────────────────
hostname    "DomWilkos Server"

// ── Game Rules ────────────────────────────────────────────────────────────────
deathmatch  1
teamplay    1
fraglimit   30
timelimit   15
maxplayers  16

// ── Voting & Admin ────────────────────────────────────────────────────────────
// sv_votable_maps must match entrypoint.sh's AIRQUAKE_MAPS list -- both are
// the set of maps confirmed to actually support the AirQuake total
// conversion (see entrypoint.sh's comment for why the rest of the mod's
// maps folder can't be used). Update both if this list changes.
sv_votable_maps    "airdmd1 airdmd2 airfox airmine airw1 bjair1"
sv_vote_threshold  0.5

// NexQuake's own patched nqserver (see nexquake/server-patch, host.c.patch
// upstream) force-changes the map after (timelimit + 1) idle minutes with
// nobody connected. With mapcycle unset it falls back to searching the
// current map for a trigger_changelevel entity, which on airdmd1 pointed
// at a non-AirQuake map -- hence the "No spawn function for ..." spam.
// Setting mapcycle explicitly keeps idle rotation inside the known-good
// AirQuake map set (same list as sv_votable_maps above).
mapcycle "airdmd1,airdmd2,airfox,airmine,airw1,bjair1"

// Players: type "register <user> <pass>" or "login <user> <pass>" at your
// own console to track your stats -- private, only you see the response.
// Admins: "admin fraglimit 40" etc. from an admin account.
// First admin account is created via the AIRQUAKE_ADMIN_USER /
// AIRQUAKE_ADMIN_PASS environment variables on the quake-airquake service.

// ── Logging (required for stats) ──────────────────────────────────────────────
// Console logging is enabled via the -condebug command-line flag in the
// Dockerfile's CMD, not a cfg cvar/command — quakespasm only checks argv
// for it at startup, so it can't be set here.
