# NexQuake server launch plan -- see docs/SETUP.md in the NexQuake project
# for the full format. This runs NexQuake's own WinQuake-derived nqserver,
# built from source with our accounts/login/voting/admin patch layered on
# top (see nexquake/Dockerfile and nexquake/server-patch/) -- NOT our
# QuakeSpasm build (vendor/quakespasm), which the browser client can't
# actually talk to (confirmed empirically -- see nexquake/README.md).
#
# No -protocol flag: this codebase has no such option, it's always plain
# NetQuake protocol 15, which is what NexQuake's client requires anyway.
#
# -mem 16: default heap is 8MB (see sys_linux.c), which NexQuake's own
# servers.ini template also bumps to 16MB as a generally-safe default --
# AirQuake's larger asset/entity set makes this worth keeping explicit.
#
# -accountsdir points accounts.dat at /app/accounts, a bind mount onto the
# SAME host directory quake-airquake uses -- shared account store between
# native and browser play (see docker-compose.yml's nexquake volumes).
# Without this override it would default to Nexus's ephemeral per-run
# overlay directory, which gets wiped on every restart -- see
# sv_accounts.c's g_accounts_dir comment.
#
# +exec server.cfg runs before +hostname so our hostname wins over
# server.cfg's own (last write wins; order matters here).
#
# +map airdmd1 picks a known-good AirQuake map explicitly -- without it the
# server falls back to id1's stock "start" map, which isn't built for the
# mod and spams "No spawn function for ..." warnings for every entity.
# Players can /vote a different map once connected (see sv_votable_maps in
# server.cfg); this is just a sane starting point.
@def -dedicated 16 -mem 16 +exec server.cfg +hostname "AirQuake"

nqserver @def -game airquake -port 26001 -accountsdir /app/accounts +map airdmd1
