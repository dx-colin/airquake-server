version: "3.8"

services:

  quake-airquake:
    build:
      context: .
    image: quake-airquake
    container_name: quake-airquake
    restart: unless-stopped
    ports:
      - "26000:26000/udp"
    volumes:
      - /opt/airquake/id1:/var/games/quake/id1:ro
      # Not read-only: server writes qconsole.log here during play
      - /opt/airquake/airquake:/var/games/quake/airquake
    environment:
      - TZ=UTC
      - SDL_VIDEODRIVER=offscreen

  quake-stats:
    build:
      context: ./stats
    image: quake-stats
    container_name: quake-stats
    restart: unless-stopped
    ports:
      - "666:26100"
    volumes:
      # Read qconsole.log written by the game server
      - /opt/airquake/airquake:/data:ro
    depends_on:
      - quake-airquake
