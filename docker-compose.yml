version: "3.8"

services:

  # Retired from public play -- nqserver (below) is now the single shared
  # game server for both native and browser clients (it speaks plain
  # NetQuake protocol 15, which native clients can also connect to
  # directly, so there's no need for two separate, unlinked game worlds
  # anymore). Kept defined (not deleted) so its image/entrypoint.sh remain
  # available for the one-shot `-createadmin` admin bootstrap, but the
  # "manual" profile means `docker compose up -d` (no args) skips it --
  # start explicitly with `docker compose --profile manual run --rm
  # quake-airquake -createadmin <user> <pass>` when needed.
  quake-airquake:
    build:
      context: .
    image: quake-airquake
    container_name: quake-airquake
    profiles: ["manual"]
    volumes:
      - /opt/airquake/id1:/var/games/quake/id1:ro
      # Not read-only: server writes qconsole.log here during play
      - /opt/airquake/airquake:/var/games/quake/airquake
    environment:
      - TZ=UTC
      - SDL_VIDEODRIVER=offscreen
      # First admin account, bootstrapped/reset on every start (see
      # entrypoint.sh) -- set these to create/reset the admin login.
      - AIRQUAKE_ADMIN_USER=${AIRQUAKE_ADMIN_USER:-}
      - AIRQUAKE_ADMIN_PASS=${AIRQUAKE_ADMIN_PASS:-}

  quake-stats:
    build:
      context: ./stats
    image: quake-stats
    container_name: quake-stats
    restart: unless-stopped
    ports:
      - "26100:26100/tcp"
    volumes:
      # Reads nqserver's per-session logs (see nexquake's /app/logs mount
      # above) -- read-only, no FIFO/welcome-message equivalent wired up
      # for nqserver yet (see stats/Dockerfile's CMD comment).
      - /opt/airquake/nexquake-logs:/logs:ro
    depends_on:
      - nexquake

  # Internal-only management/monitoring dashboard: host CPU/RAM/disk,
  # currently-connected players (login state, IP, session frags/deaths),
  # and live map/rule changes -- see manage/quake_manage.py and
  # nexquake/server-patch/sv_accounts.c's "live management dashboard"
  # section for how it talks to nqserver (two files on the same shared
  # accounts volume, no new port/protocol on the engine side).
  #
  # Deliberately NOT behind Traefik and NOT on the traefik_web network --
  # no public route exists for this at all. The port below still binds to
  # every host interface via Docker's default port publishing, so it's
  # reachable at the Pi's LAN IP (e.g. http://192.168.22.250:26200/) --
  # genuinely "internal-only" requires the router's port-forward rules to
  # simply never include 26200, same as any other unpublished LAN service.
  # No login of its own either (explicit choice -- LAN access is trusted),
  # despite this being able to change live server settings and kick
  # players, so don't add a port-forward for this one.
  quake-manage:
    build:
      context: ./manage
    image: quake-manage
    container_name: quake-manage
    restart: unless-stopped
    ports:
      - "26200:26200/tcp"
    volumes:
      # Same directory nqserver's -accountsdir points at (see nexquake's
      # volumes below) -- read/write: reads live_status.json + server.cfg
      # (for the map dropdown), writes admin_command.txt.
      - /opt/airquake/airquake:/data
      # Host stats -- read-only. /proc for CPU/load/memory, root fs for
      # disk usage.
      - /proc:/host/proc:ro
      - /:/host/root:ro
    depends_on:
      - nexquake

  # Game server for BOTH native and browser play (see the now-retired
  # quake-airquake service above -- native clients connect directly to
  # nqserver's published UDP port now instead). Built via NexQuake
  # (https://github.com/0xBrsm/NexQuake, a WASM Quake client + Go relay
  # that tunnels UDP over WebSocket for browser play) -- but NOT our
  # QuakeSpasm build (vendor/quakespasm): that engine's wire format doesn't
  # work with NexQuake's browser client (confirmed empirically, see
  # nexquake/README.md), so nexquake/Dockerfile instead builds NexQuake's
  # own WinQuake-derived nqserver from source with our accounts/login/
  # voting/admin patch (nexquake/server-patch/) layered on top.
  #
  # Served on its own subdomain (play.airquake.eragon.io), not the main
  # domain root -- airquake-landing (below) owns that with a nickname-entry
  # page. A subpath (e.g. /play) was tried first and doesn't work: the
  # client's compiled JS calls several API endpoints via hardcoded absolute
  # root paths (/gamedir, /connect, /events, /rcon, /pak/, /nqseed/, ...),
  # not just relative asset references -- confirmed by grepping index.js.
  # None of those survive a path prefix, so Nexus needs to genuinely be at
  # the root of its own hostname.
  nexquake:
    build:
      context: .
      dockerfile: nexquake/Dockerfile
    image: airquake-nexquake
    container_name: airquake-nexquake
    restart: unless-stopped
    # HTTP/WS (browser play) has no host port published -- Traefik (see the
    # labels below) is the sole ingress for that, terminating TLS and
    # proxying in over traefik_web. Deliberately not setting EXTERNAL_URL/
    # relying on Nexus's own ACME support: Traefik already owns 80/443 and
    # the "le" resolver on this host, so this runs in NexQuake's documented
    # "behind a front" mode (plain HTTP/WS internally).
    #
    # nqserver's raw game port IS published directly, though -- it's plain
    # NetQuake protocol 15, which native clients (QuakeSpasm, vkQuake, ...)
    # can connect to as-is, not just the browser client via Nexus's tunnel.
    # This makes nqserver the single shared server for both native and
    # browser play (see the now-retired quake-airquake service above).
    ports:
      - "26001:26001/udp"
    networks:
      - traefik_web
    volumes:
      # game/id1/common + game/airquake/{common,client,server} -- see
      # nexquake/README.md for layout and how it was derived from game/.
      - /opt/airquake/nexquake-game:/app/game
      # Shared account store, also used by quake-airquake's one-shot
      # -createadmin bootstrap -- see -accountsdir in nexquake/game/servers.ini.
      - /opt/airquake/airquake:/app/accounts
      # Per-run session logs (nqserver writes a fresh timestamped directory
      # under here on every start) -- read by quake-stats below.
      - /opt/airquake/nexquake-logs:/app/logs
    environment:
      # Auto-connect on page load -- fine with exactly one server defined.
      - CL_ARGS=+connect
      # Lets airquake-landing's ?+name&<nick> query string add a +name
      # token on top of CL_ARGS above, so the nickname typed on the landing
      # page becomes the player's in-game name instead of everyone sharing
      # the engine default.
      - CL_URL_ARGS=1
      # Traefik forwards the real client IP in this header -- without it,
      # source-IP bans/logging would target Traefik's own container IP.
      - AUTH_CLIENT_IP_HEADER=X-Forwarded-For
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.routers.airquake-game.rule=Host(`play.airquake.eragon.io`)
      - traefik.http.routers.airquake-game.entrypoints=websecure
      - traefik.http.routers.airquake-game.tls.certresolver=le
      - traefik.http.services.airquake-game.loadbalancer.server.port=1337
    healthcheck:
      test: ["CMD", "/app/bin/nexus", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nickname-entry landing page at the domain root -- see
  # nexquake/landing/index.html. Redirects to play.airquake.eragon.io
  # (nexquake, above) with a ?+name&<nick> query string, which CL_URL_ARGS
  # on nexquake turns into the player's in-game name. Plain static file, no
  # build step.
  airquake-landing:
    image: nginx:alpine
    container_name: airquake-landing
    restart: unless-stopped
    networks:
      - traefik_web
    volumes:
      - ./nexquake/landing/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.routers.airquake-landing.rule=Host(`airquake.eragon.io`)
      - traefik.http.routers.airquake-landing.priority=1
      - traefik.http.routers.airquake-landing.entrypoints=websecure
      - traefik.http.routers.airquake-landing.tls.certresolver=le
      - traefik.http.services.airquake-landing.loadbalancer.server.port=80

networks:
  traefik_web:
    external: true
