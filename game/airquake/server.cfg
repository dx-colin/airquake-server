// ── Server Identity ───────────────────────────────────────────────────────────
hostname    "DomWilkos Server"

// ── Game Rules ────────────────────────────────────────────────────────────────
deathmatch  1
teamplay    1
fraglimit   30
timelimit   15
maxplayers  16

// ── Voting & Admin ────────────────────────────────────────────────────────────
// sv_votable_maps must match nexquake/prepare-game-data.sh's AIRQUAKE_MAPS
// list and nexquake/game/airquake/server/server.cfg's sv_votable_maps --
// all three are the set of maps actually confirmed to load under this
// engine and support the AirQuake total conversion (empirically verified
// by spinning up each map's .bsp and checking for load errors, not just
// trusting map readmes -- several maps in the source archive turned out to
// be for "AirQuake2", an unrelated Quake II mod, despite AirQuake-sounding
// names/readmes). Update all three if this list changes.
sv_votable_maps    "airdmd1 airdmd2 airfox airmine airw1 bjair1 belgrade canyon flight57 gb1 ground1 seastrik train1 train2"
sv_vote_threshold  0.5

// Players: type "register <user> <pass>" or "login <user> <pass>" at your
// own console to track your stats -- private, only you see the response.
// Admins: "admin fraglimit 40" etc. from an admin account.
// First admin account is created via the AIRQUAKE_ADMIN_USER /
// AIRQUAKE_ADMIN_PASS environment variables on the quake-airquake service.

// ── Logging (required for stats) ──────────────────────────────────────────────
// Console logging is enabled via the -condebug command-line flag in the
// Dockerfile's CMD, not a cfg cvar/command — quakespasm only checks argv
// for it at startup, so it can't be set here.
